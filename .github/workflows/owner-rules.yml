name: Owner P0 Policy Guard
on:
  push:
    branches: [main, "feat/**", "policy/**"]
  pull_request:
    branches: [main]
jobs:
  owner-rules:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify project-level Owner policy
        run: python3 scripts/check_owner_rules.py
      - name: Run offline policy regression tests
        run: python3 -m unittest discover -s tests -p "test_owner_rules.py" -v
