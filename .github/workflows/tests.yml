name: Andy Write R0-R2 CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q andy_write
      - name: Test (no credentials or network)
        run: python -m unittest discover -s tests -v
      - name: No tracked job source or credentials
        run: |
          ! git ls-files | grep -E '^\.runs/|^\.env'
